<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma ISTQB Foundation Level — QA Calidad de Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🎯</span>
        <span class="logo-text">ISTQB QA</span>
      </div>
      <div class="sidebar-nav">
        <a class="nav-link active" data-view="home">🏠 Inicio</a>
        <div class="nav-group-label">Capítulos</div>
        <a class="nav-link" data-view="chapter" data-params='{"id":1}'>🧪 Cap. 1 — Fundamentos</a>
        <a class="nav-link" data-view="chapter" data-params='{"id":2}'>🔄 Cap. 2 — SDLC</a>
        <a class="nav-link" data-view="chapter" data-params='{"id":3}'>📋 Cap. 3 — Estática</a>
        <a class="nav-link" data-view="chapter" data-params='{"id":4}'>🎯 Cap. 4 — Técnicas</a>
        <a class="nav-link" data-view="chapter" data-params='{"id":5}'>📊 Cap. 5 — Gestión</a>
        <a class="nav-link" data-view="chapter" data-params='{"id":6}'>🔧 Cap. 6 — Herramientas</a>
        <div class="nav-group-label">Práctica</div>
        <a class="nav-link" data-view="exam">📝 Simulacro ISTQB</a>
        <a class="nav-link" data-view="flashcards">🃏 Flashcards</a>
        <a class="nav-link" data-view="glossary">📖 Glosario</a>
      </div>
      <div class="sidebar-footer">
        <button id="toggleTheme" class="theme-toggle">☀️ Modo Claro</button>
        <p>ISTQB® CTFL 2018</p>
      </div>
    </nav>

    <!-- Mobile header -->
    <header class="mobile-header">
      <button class="menu-toggle" onclick="toggleMobileSidebar()">☰</button>
      <span>ISTQB QA Platform</span>
      <button id="toggleThemeMobile" onclick="toggleTheme()" class="theme-toggle-mobile">🌙</button>
    </header>

    <!-- Main Content -->
    <main class="main-area">
      <div id="mainContent" class="main-content">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function toggleMobileSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
    }
    // Close sidebar on nav click (mobile)
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('nav-link')) {
        document.querySelector('.sidebar').classList.remove('open');
      }
    });
  </script>
</body>
</html>
